# @momojie-s/dsh-subagent-idle-delivery 组合包 patch 层：被 profile bundles 列表引用时应用。
# 行 name 用包名（非 file:// URL），由 Node 模块解析到已安装的包。
# 默认拦 subagent-settled / subagent-report 两类消息；放水阀默认 10 分钟。
- insert:
    - id: subagent-idle-delivery
      name: '@momojie-s/dsh-subagent-idle-delivery'
      config:
        heldKinds:
          - subagent-settled
          - subagent-report
        maxHoldMs: 600000
